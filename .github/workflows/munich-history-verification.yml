name: Verify Munich dated history
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/munich-history-verification.yml
      - scripts/munich_history_fallback.py
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test history validation and calculations
        run: python -m unittest discover -s tests -p 'test_munich_history_fallback.py' -v
      - name: Install exchange-page reader
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Verify live exchange closes and fallback calculation
        run: |
          python - <<'PY'
          import json, sys
          from unittest.mock import patch
          sys.path.insert(0, 'scripts')
          import market_service as m
          history=m.munich_history('GQC0.MU')
          quote=m.quote('GQC0.MU')
          with patch.object(m, 'fetch', side_effect=ValueError('Forced Yahoo history failure')):
              result=m.previous_day_change('GQC0.MU',quote['price_as_of'])
          print(json.dumps({'identity': {k:history[k] for k in ('ticker','isin','currency','url')},
                            'recent_closes':history['closes'][-5:], 'fallback_result':result},indent=2))
          assert result['prev_day_change_error'] is None
          assert 'München' in result['prev_day_change_source']
          PY
